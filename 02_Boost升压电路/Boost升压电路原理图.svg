<?xml version="1.0" encoding="UTF-8"?>
<svg width="780" height="440" viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wire { stroke:#000; stroke-width:2; fill:none; }
      .comp { stroke:#000; stroke-width:2; fill:none; }
      .node { fill:#000; }
      .lbl { font-family: 'Times New Roman', serif; font-size:16px; fill:#000; }
      .lbl-cn { font-family: 'SimSun', serif; font-size:16px; fill:#000; }
      .lbl-sm { font-family:'Times New Roman',serif; font-size:14px; fill:#000; }
    </style>
  </defs>

  <!-- 底部公共地线 -->
  <line class="wire" x1="80" y1="350" x2="680" y2="350"/>

  <!-- 正极主通路 -->
  <line class="wire" x1="80" y1="100" x2="120" y2="100"/>
  <line class="wire" x1="195" y1="100" x2="260" y2="100"/>
  <line class="wire" x1="260" y1="100" x2="310" y2="100"/>
  <line class="wire" x1="345" y1="100" x2="680" y2="100"/>

  <!-- 电池 Vin -->
  <line class="wire" x1="80" y1="100" x2="80" y2="200"/>
  <line class="comp" x1="65" y1="210" x2="95" y2="210" stroke-width="2.5"/>
  <line class="comp" x1="70" y1="225" x2="90" y2="225" stroke-width="2.5"/>
  <line class="wire" x1="80" y1="225" x2="80" y2="350"/>
  <text class="lbl" x="40" y="165" text-anchor="middle">Vin</text>
  <text class="lbl-sm" x="55" y="205" text-anchor="middle">+</text>

  <!-- 电感 L -->
  <path class="comp" d="M 120 100 A 7.5 7.5 0 0 1 135 100"/>
  <path class="comp" d="M 135 100 A 7.5 7.5 0 0 1 150 100"/>
  <path class="comp" d="M 150 100 A 7.5 7.5 0 0 1 165 100"/>
  <path class="comp" d="M 165 100 A 7.5 7.5 0 0 1 180 100"/>
  <line class="wire" x1="180" y1="100" x2="195" y2="100"/>
  <text class="lbl" x="157" y="72" text-anchor="middle">L</text>

  <!-- SW 节点 -->
  <circle class="node" cx="260" cy="100" r="4"/>
  <text class="lbl" x="260" y="82" text-anchor="middle">SW</text>

  <!-- 开关 S -->
  <line class="wire" x1="260" y1="100" x2="260" y2="175"/>
  <circle class="node" cx="260" cy="175" r="3"/>
  <line class="comp" x1="260" y1="175" x2="285" y2="220"/>
  <circle class="node" cx="260" cy="230" r="3"/>
  <line class="wire" x1="260" y1="230" x2="260" y2="350"/>
  <text class="lbl" x="295" y="205" text-anchor="start">S</text>

  <!-- 二极管 D -->
  <polygon class="comp" points="310,88 310,112 335,100"/>
  <line class="comp" x1="338" y1="86" x2="338" y2="114"/>
  <text class="lbl" x="324" y="72" text-anchor="middle">D</text>

  <!-- 输出电容 C -->
  <line class="wire" x1="450" y1="100" x2="450" y2="195"/>
  <line class="comp" x1="435" y1="195" x2="465" y2="195" stroke-width="2.5"/>
  <line class="comp" x1="435" y1="215" x2="465" y2="215" stroke-width="2.5"/>
  <line class="wire" x1="450" y1="215" x2="450" y2="350"/>
  <text class="lbl" x="450" y="82" text-anchor="middle">C</text>
  <text class="lbl-sm" x="475" y="200" text-anchor="start">+</text>

  <!-- 负载方框 -->
  <line class="wire" x1="590" y1="100" x2="590" y2="175"/>
  <rect class="comp" x="555" y="175" width="70" height="90"/>
  <text class="lbl-cn" x="590" y="228" text-anchor="middle">负载</text>
  <line class="wire" x1="590" y1="265" x2="590" y2="350"/>

  <!-- Vout 标注 -->
  <text class="lbl" x="660" y="82" text-anchor="middle">Vout</text>
  <text class="lbl-sm" x="672" y="95" text-anchor="start">+</text>

  <!-- 底部电压变换标注 -->
  <text class="lbl-cn" x="380" y="395" text-anchor="middle" font-size="15">5V → 12V</text>
</svg>
