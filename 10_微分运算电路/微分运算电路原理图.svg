<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="440" viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wire { stroke:#000; stroke-width:2; fill:none; }
      .comp { stroke:#000; stroke-width:2; fill:none; }
      .node { fill:#000; }
      .lbl { font-family:'Times New Roman',serif; font-size:16px; fill:#000; }
      .lbl-cn { font-family:'SimSun',serif; font-size:13px; fill:#000; }
      .lbl-sm { font-family:'Times New Roman',serif; font-size:12px; fill:#000; }
      .lbl-op { font-family:'Times New Roman',serif; font-size:18px; fill:#000; font-weight:bold; }
    </style>
  </defs>

  <!-- 底部公共地线 -->
  <line class="wire" x1="60" y1="360" x2="740" y2="360"/>

  <!-- ===== Vin 电池（左侧输入） ===== -->
  <line class="comp" x1="82" y1="115" x2="118" y2="115" stroke-width="2.5"/>
  <line class="comp" x1="88" y1="130" x2="112" y2="130" stroke-width="2.5"/>
  <line class="wire" x1="100" y1="115" x2="170" y2="115"/>
  <line class="wire" x1="100" y1="130" x2="100" y2="360"/>
  <text class="lbl" x="55" y="125" text-anchor="middle">Vin</text>
  <text class="lbl-sm" x="125" y="120" text-anchor="start">+</text>

  <!-- ===== 输入电容 C（水平放置，Vin → 反相端） ===== -->
  <!-- 左引线到左极板 -->
  <line class="wire" x1="170" y1="115" x2="178" y2="115"/>
  <!-- 电容左极板（垂直） -->
  <line class="comp" x1="178" y1="103" x2="178" y2="127" stroke-width="2.5"/>
  <!-- 电容右极板（垂直） -->
  <line class="comp" x1="192" y1="103" x2="192" y2="127" stroke-width="2.5"/>
  <!-- 右引线到反相端 -->
  <line class="wire" x1="192" y1="115" x2="380" y2="115"/>
  <text class="lbl" x="185" y="95" text-anchor="middle">C</text>
  <text class="lbl-cn" x="185" y="80" text-anchor="middle">输入电容</text>

  <!-- ===== 运放三角形（顶点朝右） ===== -->
  <polygon class="comp" points="400,70 400,230 530,150"/>
  <line class="wire" x1="400" y1="115" x2="380" y2="115"/>
  <text class="lbl-op" x="410" y="120" text-anchor="start">−</text>
  <line class="wire" x1="400" y1="185" x2="380" y2="185"/>
  <text class="lbl-op" x="410" y="190" text-anchor="start">+</text>
  <text class="lbl-cn" x="465" y="155" text-anchor="middle">运放</text>

  <!-- 反相端节点 -->
  <circle class="node" cx="380" cy="115" r="4.5"/>

  <!-- ===== 反馈电阻 Rf（垂直放置，反相端 → 向上 → 向右 → 电阻 → 向下接输出） ===== -->
  <line class="wire" x1="380" y1="115" x2="380" y2="40"/>
  <line class="wire" x1="380" y1="40" x2="570" y2="40"/>
  <line class="wire" x1="570" y1="40" x2="570" y2="50"/>
  <rect class="comp" x="560" y="50" width="20" height="40"/>
  <line class="wire" x1="570" y1="90" x2="570" y2="100"/>
  <line class="wire" x1="570" y1="100" x2="570" y2="150"/>
  <text class="lbl" x="595" y="73" text-anchor="start">Rf</text>
  <text class="lbl-cn" x="595" y="88" text-anchor="start">反馈电阻</text>

  <!-- ===== Rb 平衡电阻（同相端 → 向下接地） ===== -->
  <line class="wire" x1="380" y1="185" x2="380" y2="195"/>
  <rect class="comp" x="370" y="195" width="20" height="40"/>
  <line class="wire" x1="380" y1="235" x2="380" y2="245"/>
  <line class="wire" x1="380" y1="245" x2="380" y2="360"/>
  <text class="lbl" x="350" y="220" text-anchor="end">Rb</text>
  <text class="lbl-cn" x="350" y="235" text-anchor="end">平衡电阻</text>

  <!-- ===== 输出线 ===== -->
  <line class="wire" x1="530" y1="150" x2="720" y2="150"/>
  <circle class="node" cx="570" cy="150" r="4"/>
  <text class="lbl" x="710" y="130" text-anchor="middle">Vout</text>

  <!-- ===== 负载（右侧方框） ===== -->
  <line class="wire" x1="660" y1="150" x2="660" y2="240"/>
  <circle class="node" cx="660" cy="150" r="4"/>
  <rect class="comp" x="630" y="240" width="60" height="80"/>
  <text class="lbl-cn" x="660" y="285" text-anchor="middle">负载</text>
  <line class="wire" x1="660" y1="320" x2="660" y2="360"/>

  <!-- ===== 图题与公式 ===== -->
  <text class="lbl-cn" x="400" y="400" text-anchor="middle" font-size="14">Vout = −RfC × dVin / dt</text>
  <text class="lbl-cn" x="400" y="425" text-anchor="middle" font-size="13">图 1  微分运算电路标准电路</text>
</svg>
